name: Build CloudStream extension

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build Extensions
        run: |
          ./gradlew samehadaku:make
          ./gradlew kuramanime:make
          ./gradlew lk21:make

      - name: Generate Plugins JSON
        run: ./gradlew makePluginsJson

      - name: Check Generated Plugins JSON
        run: |
          echo "=== GENERATED PLUGINS.JSON ==="
          cat build/plugins.json

      - name: Prepare Repository
        run: |
          mkdir -p publish

          echo "=== Mencari file CS3 ==="
          find . -name "*.cs3" -type f

          echo "=== Menyalin plugin ==="
          cp samehadaku/build/*.cs3 publish/
          cp kuramanime/build/*.cs3 publish/
          cp lk21/build/*.cs3 publish/

          echo "=== Menyalin plugins.json hasil Gradle ==="
          cp build/plugins.json publish/

          echo "=== Memperbaiki URL plugins.json ==="

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("publish/plugins.json")
          data = json.loads(path.read_text())

          repo = "${{ github.repository }}"

          for plugin in data:
              internal_name = plugin.get("internalName", "").lower()

              if internal_name == "samehadaku":
                  plugin["name"] = "Samehadaku"
                  plugin["internalName"] = "Samehadaku"
                  plugin["url"] = f"https://raw.githubusercontent.com/{repo}/builds/samehadaku.cs3"

              if internal_name == "kuramanime":
                  plugin["name"] = "Kuramanime"
                  plugin["internalName"] = "Kuramanime"
                  plugin["url"] = f"https://raw.githubusercontent.com/{repo}/builds/kuramanime.cs3"

              if internal_name == "lk21":
                  plugin["name"] = "LK21"
                  plugin["internalName"] = "LK21"
                  plugin["url"] = f"https://raw.githubusercontent.com/{repo}/builds/lk21.cs3"

          path.write_text(
              json.dumps(data, indent=4, ensure_ascii=False) + "\n"
          )
          PY

          echo "=== Membuat repo.json ==="
          cat > publish/repo.json <<EOF
          {
            "name": "Naufal Namikaze CloudStream",
            "description": "My CloudStream extensions",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"
            ]
          }
          EOF

          echo "=== HASIL PUBLISH ==="
          echo
          echo "=== plugins.json ==="
          cat publish/plugins.json
          echo
          echo "=== repo.json ==="
          cat publish/repo.json
          echo
          echo "=== FILE ==="
          ls -lah publish

      - name: Check Publish Plugins JSON
        run: |
          echo "=== PUBLISH PLUGINS.JSON ==="
          cat publish/plugins.json

          echo
          echo "=== FILE HASH ==="
          sha256sum publish/plugins.json

      - name: Publish to builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan builds
          git rm -rf . 2>/dev/null || true

          cp -r publish/* .

          git add .
          git commit -m "Update CloudStream plugins"
          git push -f origin builds