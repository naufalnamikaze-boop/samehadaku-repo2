name: Build CloudStream extension

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Build Extensions
        run: ./gradlew samehadaku:make

      - name: Prepare Repository
        run: |
          mkdir -p publish

          echo "=== Mencari file CS3 ==="
          find . -name "*.cs3" -type f

          echo "=== Menyalin plugin ==="
          cp samehadaku/build/*.cs3 publish/

          echo "=== Membuat plugins.json ==="
          PLUGIN_FILE=$(basename "$(find publish -name "*.cs3" -type f | head -n 1)")

          cat > publish/plugins.json <<EOF
          [
            {
              "name": "Samehadaku",
              "internalName": "Samehadaku",
              "url": "https://raw.githubusercontent.com/${{ github.repository }}/builds/$PLUGIN_FILE",
              "version": 1,
              "apiVersion": 1,
              "status": 1,
              "authors": ["Naufal Namikaze"],
              "description": "Samehadaku CloudStream extension",
              "repositoryUrl": "https://github.com/${{ github.repository }}",
              "tvTypes": ["Anime"],
              "language": "id"
            }
          ]
          EOF

          echo "=== Membuat repo.json ==="
          cat > publish/repo.json <<EOF
          {
            "name": "Naufal Namikaze CloudStream",
            "description": "My CloudStream extensions",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"
            ]
          }
          EOF

          echo "=== HASIL PUBLISH ==="
          ls -lah publish

      - name: Upload CloudStream Plugin
        uses: actions/upload-artifact@v4
        with:
          name: Samehadaku-Plugin
          path: publish/*
          if-no-files-found: error

      - name: Publish builds branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan builds
          git rm -rf . 2>/dev/null || true

          cp -r publish/* .

          git add .
          git commit -m "Update CloudStream extensions"
          git push --force origin builds
